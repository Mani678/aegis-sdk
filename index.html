<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis — Large Order Protection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050505; min-height: 100vh; font-family: monospace; color: #e5e5e5; padding: 40px 20px; }
    .wrap { max-width: 600px; margin: 0 auto; }
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 22px; color: #fff; margin-bottom: 6px; }
    .header p { color: #555; font-size: 12px; }
    .presets { margin-bottom: 24px; }
    .preset-label { color: #555; font-size: 11px; margin-bottom: 8px; }
    .preset-btn { display: block; width: 100%; background: #0f0f0f; border: 1px solid #222; border-radius: 8px; padding: 10px 14px; color: #aaa; cursor: pointer; font-family: monospace; font-size: 12px; text-align: left; margin-bottom: 8px; }
    .preset-btn:hover { border-color: #444; color: #fff; }
    .card { background: #0f0f0f; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .field-label { color: #555; font-size: 11px; margin-bottom: 6px; }
    input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; color: #fff; font-family: monospace; font-size: 12px; outline: none; margin-bottom: 16px; }
    input:focus { border-color: #555; }
    .btn { width: 100%; padding: 12px 0; background: #fff; border: none; border-radius: 8px; color: #000; cursor: pointer; font-family: monospace; font-size: 13px; font-weight: bold; }
    .btn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
    .result { border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .result-title { font-size: 14px; font-weight: bold; color: #fff; }
    .tier-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .order-size { margin-bottom: 20px; }
    .order-size .label { color: #555; font-size: 11px; margin-bottom: 4px; }
    .order-size .value { font-size: 26px; font-weight: bold; color: #fff; }
    .comparison { background: #1a1a1a; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .comparison .label { color: #555; font-size: 11px; margin-bottom: 12px; }
    .comparison .row { display: flex; justify-content: space-between; align-items: center; }
    .swap-bad .tag { color: #ef4444; font-size: 11px; }
    .swap-bad .amount { font-size: 18px; font-weight: bold; color: #ef4444; }
    .swap-bad .loss { color: #ef4444; font-size: 11px; }
    .arrow { color: #333; font-size: 20px; }
    .swap-good { text-align: right; }
    .swap-good .tag { color: #22c55e; font-size: 11px; }
    .swap-good .amount { font-size: 18px; font-weight: bold; color: #22c55e; }
    .swap-good .info { color: #22c55e; font-size: 11px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat { background: #1a1a1a; border-radius: 8px; padding: 12px; }
    .stat .label { color: #555; font-size: 11px; margin-bottom: 4px; }
    .stat .value { font-weight: bold; font-size: 14px; }
    .stat .sub { color: #555; font-size: 11px; }
    .reason-box { background: #1a1a1a; border-radius: 8px; padding: 12px; }
    .reason-box .label { color: #555; font-size: 11px; margin-bottom: 4px; }
    .reason-box .text { color: #aaa; font-size: 12px; line-height: 1.5; }
    .error-box { background: #1a0a0a; border: 1px solid #ef444433; border-radius: 8px; padding: 16px; color: #ef4444; font-size: 13px; margin-bottom: 24px; }
    .footer { text-align: center; color: #333; font-size: 11px; margin-top: 32px; }
    .footer a { color: #555; text-decoration: none; }
    .footer a:hover { color: #aaa; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>⚡ AEGIS</h1>
    <p>Large order execution protection for DeFi interfaces</p>
  </div>

  <div class="presets">
    <div class="preset-label">QUICK TEST</div>
    <button class="preset-btn" onclick="loadPreset('0x23878914efe38d27c4d67ab83ed1b93a74d4086a','0xa700b4eb416be35b2911fd5dee80678ff64ff6c9',50432688)">
      $50M Transaction (The Incident) — $50,432,688
    </button>
    <button class="preset-btn" onclick="loadPreset('0xdac17f958d2ee523a2206206994597c13d831ec7','0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2',500000)">
      $500K Mid-size Order — $500,000
    </button>
    <button class="preset-btn" onclick="loadPreset('0xdac17f958d2ee523a2206206994597c13d831ec7','0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2',10000)">
      $10K Small Order — $10,000
    </button>
  </div>

  <div class="card">
    <div class="field-label">SELL TOKEN ADDRESS</div>
    <input id="sellToken" placeholder="0x..." />
    <div class="field-label">BUY TOKEN ADDRESS</div>
    <input id="buyToken" placeholder="0x..." />
    <div class="field-label">ORDER SIZE (USD)</div>
    <input id="amount" placeholder="50000000" type="number" />
    <button class="btn" id="classifyBtn" onclick="classify()">CLASSIFY ORDER</button>
  </div>

  <div id="error" class="error-box" style="display:none"></div>
  <div id="result" style="display:none"></div>

  <div class="footer">
    Built by <a href="https://x.com/Mani_chukk">@Mani_chukk</a> ·
    <a href="https://github.com/Mani678/aegis-sdk">github.com/Mani678/aegis-sdk</a>
  </div>

</div>

<script>
  const POOL_DEPTH = {
    'usdt-weth': 180_000_000,
    'weth-aave': 8_000_000,
    'aethusdt-aethaave': 8_000_000,
    'default': 5_000_000
  }

  function getPoolDepth(sell, buy) {
    const key = `${sell.toLowerCase()}-${buy.toLowerCase()}`
    const s = sell.toLowerCase()
    const b = buy.toLowerCase()
    if (s.includes('23878914') || b.includes('a700b4')) return 8_000_000
    if (s.includes('dac17f') && b.includes('c02aaa')) return 180_000_000
    if (s.includes('c02aaa') && b.includes('7fc66')) return 8_000_000
    return 5_000_000
  }

  function estimateImpact(orderUSD, poolUSD) {
    const ratio = orderUSD / poolUSD
    if (ratio < 0.01) return ratio * 0.5
    if (ratio < 0.05) return ratio * 1.2
    if (ratio < 0.20) return ratio * 2.5
    return Math.min(ratio * 4.0, 0.9999)
  }

  function getSeverity(p) {
    if (p < 0.01) return 'low'
    if (p < 0.05) return 'moderate'
    if (p < 0.20) return 'severe'
    return 'catastrophic'
  }

  function getTier(size, slippage, ratio) {
    if (size > 5_000_000) return 3
    if (size > 100_000) return 2
    if (slippage > 0.05) return 3
    if (slippage > 0.01) return 2
    if (ratio > 0.15) return 3
    if (ratio > 0.03) return 2
    return 1
  }

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString('en-US')
  }

  function loadPreset(sell, buy, amount) {
    document.getElementById('sellToken').value = sell
    document.getElementById('buyToken').value = buy
    document.getElementById('amount').value = amount
    document.getElementById('result').style.display = 'none'
    document.getElementById('error').style.display = 'none'
  }

  async function classify() {
    const sell = document.getElementById('sellToken').value.trim()
    const buy = document.getElementById('buyToken').value.trim()
    const amount = parseFloat(document.getElementById('amount').value)
    const btn = document.getElementById('classifyBtn')
    const errorBox = document.getElementById('error')
    const resultBox = document.getElementById('result')

    if (!sell || !buy || !amount) {
      errorBox.textContent = 'Please fill in all fields'
      errorBox.style.display = 'block'
      return
    }

    btn.textContent = 'CLASSIFYING...'
    btn.disabled = true
    errorBox.style.display = 'none'
    resultBox.style.display = 'none'

    try {
      const poolDepth = getPoolDepth(sell, buy)
      const slippage = estimateImpact(amount, poolDepth)
      const ratio = amount / poolDepth
      const tier = getTier(amount, slippage, ratio)
      const outputUSD = amount * (1 - slippage)
      const lossUSD = amount - outputUSD
      const tranches = Math.ceil(amount / 2_000_000)
      const windowHours = Math.ceil(tranches / 6)
      const twapOutput = amount * 0.997
      const severity = getSeverity(slippage)

      const tierColor = { 1: '#22c55e', 2: '#f59e0b', 3: '#ef4444' }[tier]
      const tierLabel = { 1: 'TIER 1 — SAFE', 2: 'TIER 2 — CAUTION', 3: 'TIER 3 — CRITICAL' }[tier]

      const method = tier === 1 ? 'single_swap' : tier === 2 ? 'split_recommended' : 'twap_required'
      const reason = tier === 1
        ? 'Order size is within safe liquidity depth'
        : tier === 2
        ? `Order may cause ${(slippage * 100).toFixed(1)}% slippage — splitting recommended`
        : `Order is ${(ratio * 100).toFixed(0)}% of available pool depth — single swap will cause catastrophic slippage`

      resultBox.style.display = 'block'
      resultBox.style.background = '#0f0f0f'
      resultBox.style.border = `1px solid ${tierColor}`
      resultBox.style.borderRadius = '12px'
      resultBox.style.padding = '24px'
      resultBox.style.marginBottom = '24px'

      resultBox.innerHTML = `
        <div class="result-header">
          <div class="result-title">ASSESSMENT</div>
          <div class="tier-badge" style="background:${tierColor}22;border:1px solid ${tierColor};color:${tierColor}">${tierLabel}</div>
        </div>
        <div class="order-size">
          <div class="label">ORDER SIZE</div>
          <div class="value">${fmt(amount)}</div>
        </div>
        <div class="comparison">
          <div class="label">EXECUTION COMPARISON</div>
          <div class="row">
            <div class="swap-bad">
              <div class="tag">SINGLE SWAP</div>
              <div class="amount">${fmt(outputUSD)}</div>
              <div class="loss">-${fmt(lossUSD)} lost</div>
            </div>
            <div class="arrow">→</div>
            <div class="swap-good">
              <div class="tag">VIA TWAP</div>
              <div class="amount">${fmt(twapOutput)}</div>
              ${tier > 1 ? `<div class="info">${tranches} tranches · ${windowHours}h</div>` : ''}
            </div>
          </div>
        </div>
        <div class="grid">
          <div class="stat">
            <div class="label">SLIPPAGE</div>
            <div class="value" style="color:${tierColor}">${(slippage * 100).toFixed(2)}%</div>
            <div class="sub">${severity}</div>
          </div>
          <div class="stat">
            <div class="label">POOL DEPTH</div>
            <div class="value">${fmt(poolDepth)}</div>
            <div class="sub">${(ratio * 100).toFixed(1)}% of depth</div>
          </div>
        </div>
        <div class="reason-box">
          <div class="label">RECOMMENDATION</div>
          <div class="text">${reason}</div>
        </div>
      `
    } catch (e) {
      errorBox.textContent = e.message
      errorBox.style.display = 'block'
    } finally {
      btn.textContent = 'CLASSIFY ORDER'
      btn.disabled = false
    }
  }
</script>
</body>
</html>
